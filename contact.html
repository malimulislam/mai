<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MD ALIMUL ISLAM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

  <!-- Shared header will be loaded here -->
  <div id="header"></div>

  <script>
    // Load the header and then attach the toggle function
    fetch('header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;

        // Attach the toggle function after header is loaded
        const icon = document.querySelector('#header .icon');
        if (icon) {
          icon.addEventListener('click', function () {
            const nav = document.getElementById('myTopnav');
            if (nav.className === 'topnav') {
              nav.className += ' responsive';
            } else {
              nav.className = 'topnav';
            }
          });
        }
      });
  </script>


  <main>
    <h2>Contact</h2>

    <p><strong>Mailing Address:</strong><br>
    143 (Kazi Aref Road), Kachubaria, Khoyarpur, Mirpur, Kushtia-7030, Bangladesh.</p>

    <p><strong>Permanent Address:</strong><br>
    143 (Kazi Aref Road), Kachubaria, Khoyarpur, Mirpur, Kushtia-7030, Bangladesh.</p>

    <h3>Send Me a Message</h3>
    <form action="https://formspree.io/f/your-form-id" method="POST">
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="subject">Subject:</label><br>
      <input type="text" id="subject" name="subject"><br><br>

      <label for="message">Message:</label><br>
      <textarea id="message" name="message" rows="5" required></textarea><br><br>

      <button type="submit">Send</button>
    </form>
  </main>

<!-- Shared footer will be loaded here -->
<div id="footer"></div>

<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('footer').innerHTML = data;
    });
</script>

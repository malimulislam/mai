<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MD ALIMUL ISLAM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

  <!-- Shared header will be loaded here -->
  <div id="header"></div>

  <script>
    // Load the header and then attach the toggle function
    fetch('header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;

        // Attach the toggle function after header is loaded
        const icon = document.querySelector('#header .icon');
        if (icon) {
          icon.addEventListener('click', function () {
            const nav = document.getElementById('myTopnav');
            if (nav.className === 'topnav') {
              nav.className += ' responsive';
            } else {
              nav.className = 'topnav';
            }
          });
        }
      });
  </script>

<main>
  <h2>Gallery</h2>
  <img src="images/design1.jpg" alt="Design 1">
  <img src="images/app1.jpg" alt="App Screenshot">
</main>

<!-- Shared footer will be loaded here -->
<div id="footer"></div>

<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('footer').innerHTML = data;
    });
</script>
